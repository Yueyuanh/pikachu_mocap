# Pikachu URDF → Blender 内导入的 URDF 骨架 关节轴映射
#
# 用途：Qt 端把当前 URDF 关节角（弧度），按每套 armature 的 joints 映射换算成 Blender 里
#       该 URDF 骨架的骨骼欧拉角，调 set_urdf_pose 驱动（是否生效由 Blender 插件面板
#       Skeleton Server → “Drive URDF armatures” 的勾选决定）。
#
# 公式:  blender_bone_axis_rad = urdf_joint_rad * sign + bias   （bias 单位弧度，默认 0）
#
# 【关键】armature 的 name 必须 == Blender 场景里该 URDF 骨架的【对象名】：
#        `- name:` 就是让 Qt set_urdf_pose(name) 精确命中那台骨架；名字对不上的块等于不存在，
#        addon 会忽略或回退到“当前激活 / 首个 ARMATURE” → 时好时坏。
#        当前 Blender 里只有一台 27dof 骨架（对象名 pikachu_urdf_T），故这里只登记这一套。
#        将来导入别的 URDF 骨架，照抄一个块并把 name 改成对应对象名即可。
#
# 骨名 = Blender URDF importer 命名：<关节名>.<type>.bone（如 left_knee_joint.revolute.bone）。
# controls：URDF 骨的“头→尾”方向 == 该关节轴（骨本地 +X == joint axis），故统一 axis:x sign:+1；
#           实测某骨反向 → 把对应项 sign 改 -1 并在 GUI Reload。
# 限位 limit(度) 已统一对齐 27dof URDF 的真实关节限位（sign>0 → [L,U]，sign<0 → [-U,-L]）。

enabled: true

armatures:

  # ── 当前 27dof URDF 骨架（Blender 对象名 = pikachu_urdf_T，28 骨 = root + 27 关节）──
  # 头是 head_pitch/head_yaw/head_roll 三个独立 .revolute.bone（非旧单一 head_joint）。
  - name: "pikachu_urdf_T"
    base_pos: { pos_retarget : [y,x,z],pos_scale: [2.0, 2.0, 2.0], pos_dir: [1.0, -1.0, 1.0]}
    base_rot: { rot_retarget : [x,y,z],rot_scale: [1.0, 1.0, 1.0], rot_offset: [0.0, 0.0, -90.0] }
    joints:
      left_hip_pitch_joint:   { bone: left_hip_pitch_joint.revolute.bone,   axis: y, sign:  1, bias: 0.0, limit: [0.0, 139.8] }
      left_hip_roll_joint:    { bone: left_hip_roll_joint.revolute.bone,    axis: y, sign:  1, bias: 0.0, limit: [-5.2, 14.9] }
      left_hip_yaw_joint:     { bone: left_hip_yaw_joint.revolute.bone,     axis: y, sign:  1, bias: 0.0, limit: [-5.2, 14.9] }
      left_knee_joint:        { bone: left_knee_joint.revolute.bone,        axis: y, sign:  1, bias: 0.0, limit: [0.0, 90.0] }
      left_ankle_joint:       { bone: left_ankle_joint.revolute.bone,       axis: y, sign:  1, bias: 0.0, limit: [-29.8, 60.2] }
      right_hip_pitch_joint:  { bone: right_hip_pitch_joint.revolute.bone,  axis: y, sign:  1, bias: 0.0, limit: [0.0, 139.8] }
      right_hip_roll_joint:   { bone: right_hip_roll_joint.revolute.bone,   axis: y, sign:  1, bias: 0.0, limit: [-5.2, 14.9] }
      right_hip_yaw_joint:    { bone: right_hip_yaw_joint.revolute.bone,    axis: y, sign:  1, bias: 0.0, limit: [-5.2, 14.9] }
      right_knee_joint:       { bone: right_knee_joint.revolute.bone,       axis: y, sign:  1, bias: 0.0, limit: [0.0, 90.0] }
      right_ankle_joint:      { bone: right_ankle_joint.revolute.bone,      axis: y, sign:  1, bias: 0.0, limit: [-29.8, 60.2] }

      left_arm_pitch_joint:   { bone: left_arm_pitch_joint.revolute.bone,   axis: y, sign:  -1, bias: 0.0, limit: [-90.0, 90.0] }
      left_arm_roll_joint:    { bone: left_arm_roll_joint.revolute.bone,    axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }
      right_arm_pitch_joint:  { bone: right_arm_pitch_joint.revolute.bone,  axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }
      right_arm_roll_joint:   { bone: right_arm_roll_joint.revolute.bone,   axis: y, sign:  -1, bias: 0.0, limit: [-90.0, 90.0] }
      # 27dof 臂的 arm_yaw / elbow 关节；axis:y sign:+1 为初值，实测某骨反向翻 sign 并在 GUI Reload。
      left_arm_yaw_joint:     { bone: left_arm_yaw_joint.revolute.bone,     axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }
      left_elbow_joint:       { bone: left_elbow_joint.revolute.bone,       axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }
      right_arm_yaw_joint:    { bone: right_arm_yaw_joint.revolute.bone,    axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }
      right_elbow_joint:      { bone: right_elbow_joint.revolute.bone,      axis: y, sign:  1, bias: 0.0, limit: [-90.0, 90.0] }



      # 27dof 头：head_pitch/head_yaw/head_roll 三个独立 .revolute.bone（非旧单一 head_joint）。
      # 每骨本地骨长轴 == 各自 joint axis，统一 axis:x sign:+1 直驱；实测某骨反向翻 sign 并 Reload。
      head_yaw_joint:   { bone: head_yaw_joint.revolute.bone,   axis: y, sign:  1, bias: 0.0, limit: [-45.8, 45.8] }
      head_pitch_joint: { bone: head_pitch_joint.revolute.bone, axis: y, sign:  1, bias: 0.0, limit: [-45.8, 45.8] }
      head_roll_joint:  { bone: head_roll_joint.revolute.bone,  axis: y, sign:  1, bias: 0.0, limit: [-45.8, 45.8] }
      # 27dof 新增的耳朵/尾巴关节；axis 初值多为 y，实测反向改 sign 并在 GUI Reload。
      left_ear_pitch_joint:   { bone: left_ear_pitch_joint.revolute.bone,   axis: y, sign:  1, bias: 0.0, limit: [-34.4, 45.8] }
      left_ear_roll_joint:    { bone: left_ear_roll_joint.revolute.bone,    axis: y, sign:  -1, bias: 0.0, limit: [-34.4, 45.8] }
      right_ear_pitch_joint:  { bone: right_ear_pitch_joint.revolute.bone,  axis: y, sign:  -1, bias: 0.0, limit: [-34.4, 45.8] }
      right_ear_roll_joint:   { bone: right_ear_roll_joint.revolute.bone,   axis: y, sign:  1, bias: 0.0, limit: [-34.4, 45.8] }
      tail_pitch_joint:       { bone: tail_pitch_joint.revolute.bone,       axis: y, sign:  1, bias: 0.0, limit: [-68.8, 68.8] }
      tail_yaw_joint:         { bone: tail_yaw_joint.revolute.bone,         axis: y, sign:  1, bias: 0.0, limit: [-68.8, 68.8] }