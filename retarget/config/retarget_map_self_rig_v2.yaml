# ============================================================================
# Pikachu URDF(V025) → Blender 「自定义自绑骨架」 Pikacuh_skin_self_rig_v2 重定向映射
# ============================================================================
# 用途：把单自由度 URDF 关节角，映射到 self_rig_v2 骨架里对应骨骼的本地旋转轴，
#       通过 set_pose（带 armature 名）驱动这块自定义蒙皮。
#
#   公式:  sink_axis_angle = joint_angle(度) * sign + bias
#   随后按 limit 钳位，写入 pose[bone][axis]，同一骨多个轴累加。
#
# 骨架层级（Blender 实测，16 骨）:
#   base_link
#     ├─ head                (eye_L, eye_R)
#     ├─ arm_L → arm_pitch_L
#     └─ arm_R → arm_pitch_R
#   hip_L → hip_pitch_L → hip_knee_L → hip_ankle_L
#   hip_R → hip_pitch_R → hip_knee_R → hip_ankle_R
#
# 轴/符号依据 base retarget_map.yaml 与 URDF 轴方向约定给出初值；若实测某骨反向，
# 把对应项 sign 取反、或把 axis 换成实际变形轴即可。
# 修改后在 GUI 重定向面板点 【Reload Map】 生效。
# ============================================================================

version: 1

retarget:

  # ── 头部 ────────────────────────────────────────────────────────────────
  head_yaw_joint:
    bone: head
    axis: y
    sign: 1
    bias: 0.0
    limit: [-60.0, 60.0]

  head_pitch_joint:
    bone: head
    axis: x
    sign: -1
    bias: 0.0
    limit: [-60.0, 60.0]

  head_roll_joint:
    bone: head
    axis: z
    sign: -1
    bias: 0.0
    limit: [-60.0, 60.0]

  # ── 左臂 ────────────────────────────────────────────────────────────────
  # arm_L = 肩（三轴收 pitch/roll/yaw），arm_pitch_L = 下臂/肘
  left_arm_pitch_joint:
    bone: arm_pitch_L
    axis: x
    sign: -1
    bias: 0.0
    limit: [-180.0, 180.0]

  left_arm_roll_joint:
    bone: arm_pitch_L
    axis: z
    sign: 1
    bias: 0.0
    limit: [-180.0, 180.0]

  left_arm_yaw_joint:
    bone: arm_pitch_L
    axis: y
    sign: 1
    bias: 0.0
    limit: [-180.0, 180.0]


  # left_elbow_ankle_joint:
  #   bone: arm_pitch_L
  #   axis: y
  #   sign: 1
  #   bias: 0.0
  #   limit: [0.0, 140.0]

  # ── 右臂 ────────────────────────────────────────────────────────────────
  right_arm_pitch_joint:
    bone: arm_pitch_R
    axis: x
    sign: -1
    bias: 0.0
    limit: [-180.0, 180.0]

  right_arm_roll_joint:
    bone: arm_pitch_R
    axis: z
    sign: 1
    bias: 0.0
    limit: [-180.0, 180.0]

  right_arm_yaw_joint:
    bone: arm_pitch_R
    axis: y
    sign: 1
    bias: 0.0
    limit: [-180.0, 180.0]

  # right_elbow_ankle_joint:
  #   bone: arm_pitch_R
  #   axis: y
  #   sign: 1
  #   bias: 0.0
  #   limit: [0.0, 140.0]

  # ── 左腿 ────────────────────────────────────────────────────────────────
  # hip_L = 骨盆（roll/yaw），hip_pitch_L = 大腿（pitch），其余单轴
  left_hip_pitch_joint:
    bone: hip_pitch_L
    axis: x
    sign: 1
    bias: 0.0
    limit: [-140.0, 0.0]

  left_hip_roll_joint:
    bone: hip_pitch_L
    axis: z
    sign: -1
    bias: 0.0
    limit: [-5.0, 15.0]

  left_hip_yaw_joint:
    bone: hip_pitch_L
    axis: y
    sign: 1
    bias: 0.0
    limit: [-5.0, 15.0]

  left_knee_joint:
    bone: hip_knee_L
    axis: x
    sign: -1
    bias: 0.0
    limit: [0.0, 90.0]

  left_ankle_joint:
    bone: hip_ankle_L
    axis: x
    sign: -1
    bias: 0.0
    limit: [-60.0, 30.0]

  # ── 右腿 ────────────────────────────────────────────────────────────────
  right_hip_pitch_joint:
    bone: hip_pitch_R
    axis: x
    sign: -1
    bias: 0.0
    limit: [-140.0, 0.0]

  right_hip_roll_joint:
    bone: hip_pitch_R
    axis: z
    sign: -1
    bias: 0.0
    limit: [-5.0, 15.0]

  right_hip_yaw_joint:
    bone: hip_pitch_R
    axis: y
    sign: 1
    bias: 0.0
    limit: [-15.0, 5.0]

  right_knee_joint:
    bone: hip_knee_R
    axis: x
    sign: 1
    bias: 0.0
    limit: [0.0, 90.0]

  right_ankle_joint:
    bone: hip_ankle_R
    axis: x
    sign: 1
    bias: 0.0
    limit: [-60.0, 30.0]