<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>URDF + Skin 随动预研</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #10131a;
    --panel: #1a202b;
    --line: #2a3342;
    --fg: #d7dfea;
    --muted: #8a95a6;
    --accent: #ffcf3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.55 "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; gap: 0; }
  #panel { background: var(--panel); border-right: 1px solid var(--line);
    padding: 16px; overflow-y: auto; }
  h1 { font-size: 14px; margin: 0 0 4px; color: #fff; }
  .sub { color: var(--muted); font-size: 11px; margin-bottom: 16px; }
  .grp { margin: 14px 0 4px; color: var(--accent); font-size: 11px;
    letter-spacing: 1px; text-transform: uppercase; }
  label { display: block; margin: 10px 0 2px; }
  label .name { font-weight: 700; color:#fff; }
  label .pair { color: var(--muted); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .val { color: var(--accent); font-weight: 700; }
  #status { margin-top: 14px; font-size: 11px; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 10px; white-space: pre-wrap; }
  #pview { position: relative; }
  #gl { display: block; width: 100%; height: 100%; }
  .badge { position: absolute; left: 12px; bottom: 12px; font-size: 11px;
    color: var(--muted); background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>URDF ⇄ Skin 随动预研</h1>
    <div class="sub">纯 three.js · 同一场景加载 URDF FK 参考骨架 + skin.glb 蒙皮<br>拖动滑块，URDF 关节角 与 蒙皮 DEF 骨 同步旋转</div>

    <div id="joints"></div>

    <div id="status">loading…</div>
  </div>
  <div id="pview">
    <canvas id="gl"></canvas>
    <div class="badge">左: URDF FK(STL 壳逐骨) · 右: 蒙皮 skin.glb(DEF-* 骨)</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three":             "/lib/three.module.js",
    "three/addons/":     "/lib/",
    "three/addons/libs/": "/lib/libs/"
} }
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
